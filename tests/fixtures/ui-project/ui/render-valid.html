<rml>
<head>
<style>
body
{
	width: 100%;
	height: 100%;
	font-family: NextSans;
	font-size: 16px;
	color: #FFFFFF;
}

/* Declares its display: the RCSS default is inline, which would discard every
   box property below. */
#panel
{
	display: block;
	position: absolute;
	left: 20px;
	top: 20px;
	width: 200px;
	height: 80px;
	background-color: #2C6E49;
}
</style>
</head>
<body>
<div id="panel">Panel</div>
</body>
</rml>
